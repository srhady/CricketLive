name: Sports Private Engine (Cricket)

on:
  workflow_dispatch: # For manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🌐 Checkout Public Repository (CricketLive)
      uses: actions/checkout@v4

    - name: 🔐 Checkout Private Repository (axsportspvt)
      uses: actions/checkout@v4
      with:
        repository: srhady/axsportspvt
        token: ${{ secrets.GH_PAT }}
        path: private_scripts

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests Pillow beautifulsoup4 cloudscraper

    - name: 🚀 Run Cricket Engine (Private)
      run: python private_scripts/cricket.py
      continue-on-error: true

    - name: 💾 Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Prevent crash if files are missing
        git add playlist.m3u || true
        git add posters/ || true
        
        git diff --quiet && git diff --staged --quiet || git commit -m "⚡ Manual Update: Cricket Engine"
        git push
